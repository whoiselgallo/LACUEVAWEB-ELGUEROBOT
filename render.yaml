# ═════════════════════════════════════════════════════════════════════════════════
# RENDER BLUEPRINT - LA CUEVA DEL GÜERO
# Archivo de configuración automática para despliegues en Render.com
# ⚠️  Todas las credenciales se configuran en el Dashboard de Render.com
#     NO almacenar API Keys ni contraseñas en este archivo
# ═════════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: lacuevaweb-elguerobot
    env: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /
    envVars:
      # --- APP ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: La Cueva del Güero
      - key: APP_VERSION
        value: "2.0.2"
      - key: APP_URL
        sync: false

      # --- BASE DE DATOS (NEON.TECH) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false

      # --- DIFY AI ---
      - key: DIFY_CHATBOT_API_KEY
        sync: false
      - key: DIFY_CHATBOT_URL
        value: https://api.dify.ai/v1/chat-messages
      - key: DIFY_WORKFLOW_API_KEY
        sync: false
      - key: DIFY_WORKFLOW_URL
        value: https://api.dify.ai/v1/workflows/run
      - key: DIFY_TIMEOUT
        value: "60"

      # --- GOOGLE GEMINI ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false

      # --- DASHBOARD DE ADMINISTRACIÓN ---
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false

      # --- GOOGLE OAUTH / DRIVE ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
