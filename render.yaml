# ═════════════════════════════════════════════════════════════════════════════════
# RENDER BLUEPRINT - LA CUEVA DEL GÜERO
# Archivo de configuración automática para despliegues en Render.com
# ⚠️  Todas las credenciales se configuran en el Dashboard de Render.com
#     NO almacenar API Keys ni contraseñas en este archivo
# ═════════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: lacuevaweb-elguerobot
    env: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      # --- BASE DE DATOS (NEON.TECH) ---
      # Configura estos valores en: Render Dashboard > Environment
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false

      # --- INTELIGENCIA ARTIFICIAL (DIFY.AI) ---
      - key: DIFY_API_KEY
        sync: false

      # --- DASHBOARD DE ADMINISTRACIÓN ---
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
