<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking de Invitado | La Cueva del Güero</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/webp" href="/images/logotipo.webp">
  <link rel="icon" type="image/png" href="/images/logotipo.png">
  <link rel="apple-touch-icon" href="/images/logotipo.png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: #080810;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .tracking-card {
      background: rgba(15, 15, 25, 0.95);
      border: 2px solid var(--cian-neon, #00ffff);
      border-radius: 20px;
      padding: 35px 30px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
      text-align: center;
      position: relative;
    }
    .tracking-title {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    .tracking-search-box {
      display: flex;
      gap: 10px;
      margin: 25px 0 15px 0;
    }
    .tracking-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 255, 255, 0.4);
      border-radius: 10px;
      padding: 12px 15px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .tracking-input:focus {
      border-color: #ff00ff;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
    }
    .btn-track {
      background: #00ffff;
      color: #000;
      border: none;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-track:hover {
      box-shadow: 0 0 15px #00ffff;
      transform: scale(1.03);
    }
    .btn-recover {
      background: transparent;
      border: none;
      color: #ff00ff;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.9rem;
      margin-top: 5px;
      display: inline-block;
    }
    .btn-recover:hover {
      color: #00ffff;
      text-shadow: 0 0 8px #00ffff;
    }
    
    /* PROGRESS TIMELINE */
    .timeline {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }
    .timeline-step {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border-left: 4px solid #444;
      transition: all 0.3s ease;
    }
    .timeline-step.completed {
      border-left-color: #00ff00;
      background: rgba(0, 255, 0, 0.06);
    }
    .timeline-step.active {
      border-left-color: #00ffff;
      background: rgba(0, 255, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
    }
    .step-icon {
      font-size: 1.3rem;
      width: 30px;
      text-align: center;
    }
    .step-info h4 {
      margin: 0 0 4px 0;
      font-size: 1rem;
    }
    .step-info p {
      margin: 0;
      font-size: 0.85rem;
      color: #aaa;
    }

    /* MODAL RECUPERACIÓN */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #12121e;
      border: 2px solid #ff00ff;
      border-radius: 15px;
      padding: 25px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="tracking-card">
    <a href="../index.html" style="position: absolute; top: 20px; left: 20px; color: #00ffff; text-decoration: none; font-size: 0.9rem;">
      <i class="fa-solid fa-arrow-left"></i> Volver a la Cueva
    </a>

    <h2 class="tracking-title"><i class="fa-solid fa-satellite-dish"></i> Tracking de Invitado</h2>
    <p style="color: #bbb; font-size: 0.95rem;">Monitorea en vivo en qué fase va tu episodio.</p>

    <!-- FORMULARIO DE CONSULTA -->
    <div class="tracking-search-box">
      <input type="text" id="guestCodeInput" class="tracking-input" placeholder="Ingresa tu Código (Ej: GUEST-7482 o Token)">
      <button class="btn-track" onclick="consultarTracking()"><i class="fa-solid fa-magnifying-glass"></i> Consultar</button>
    </div>

    <!-- BOTÓN RECUPERAR/GENERAR CÓDIGO -->
    <div>
      <button class="btn-recover" onclick="abrirModalRecuperar()">
        <i class="fa-solid fa-key"></i> ¿Perdiste o no tienes tu código? Generar / Recuperar aquí
      </button>
    </div>

    <!-- RESULTADO DEL TRACKING -->
    <div id="trackingResult" style="display: none;">
      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 25px 0;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <div style="text-align: left;">
          <h3 id="guestNameHeader" style="margin: 0; color: #ff00ff; text-shadow: 0 0 8px #ff00ff;">Invitado: —</h3>
          <span style="font-size: 0.85rem; color: #aaa;">Código: <b id="activeCodeText" style="color:#00ffff;">—</b></span>
        </div>
        <span id="guestBadgeStatus" style="background: rgba(0,255,255,0.15); color: #00ffff; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; border: 1px solid rgba(0,255,255,0.3);">Fase: —</span>
      </div>

      <!-- BOTONES DE COMPARTIR Y COPIAR LINK -->
      <div style="display: flex; gap: 10px; justify-content: center; margin: 15px 0 20px 0; flex-wrap: wrap;">
        <button id="btnCopyTrackingLink" class="btn-track" style="background: #ff00ff; color: #fff;" onclick="copiarEnlaceTrackingDirecto()">
          <i class="fa-solid fa-copy"></i> <span id="btnCopyText">Copiar Link de Tracking</span>
        </button>
        <a id="btnShareWa" href="#" target="_blank" class="btn-track" style="background: #25D366; color: #fff; text-decoration: none;">
          <i class="fa-brands fa-whatsapp"></i> Enviar por WhatsApp
        </a>
      </div>

      <!-- TIMELINE DE PROGRESO -->
      <div class="timeline" id="timelineContainer"></div>
    </div>
  </div>

  <!-- MODAL DE GENERACIÓN / RECUPERACIÓN DE CÓDIGO -->
  <div id="modalRecuperar" class="modal-overlay">
    <div class="modal-content">
      <h3 style="color: #ff00ff; margin-top: 0;"><i class="fa-solid fa-wand-magic-sparkles"></i> Obtener tu Código</h3>
      <p style="font-size: 0.9rem; color: #ccc;">Ingresa tu correo o tu nombre para recuperar tu código asignado por El Güero:</p>
      
      <input type="text" id="recoverInput" class="tracking-input" style="width: 100%; box-sizing: border-box; margin-bottom: 15px;" placeholder="Tu Correo o Nombre Completo">
      
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn-track" style="background: #ff00ff; color: #fff;" onclick="ejecutarRecuperacion()">Generar / Buscar</button>
        <button class="btn-track" style="background: #333; color: #fff;" onclick="cerrarModalRecuperar()">Cancelar</button>
      </div>

      <div id="recoverResult" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    const FASES = [
      { key: 'cuestionario', label: '1. Cuestionario & Storytelling', desc: 'Respuestas de anécdotas y temas clave registradas' },
      { key: 'escaleta', label: '2. Escaleta & Curaduría', desc: 'Guión y tiempos aprobados por producción' },
      { key: 'grabado', label: '3. Grabación en La Cueva', desc: 'Sesión grabada en vivo en Mexicali' },
      { key: 'edicion', label: '4. Postproducción & Masterización', desc: 'Corte de silencios, audio -14 LUFS y miniaturas' },
      { key: 'publicado', label: '5. Publicado al Aire', desc: 'Disponible en YouTube, Spotify y Redes' }
    ];

    let codigoActual = '';

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('id') || urlParams.get('token') || urlParams.get('code');
      if (code) {
        document.getElementById('guestCodeInput').value = code;
        consultarTracking();
      }
    });

    function getTrackingApiUrl() {
      return window.location.pathname.includes('/tracking') ? '../api/api-guest-tracking.php' : '/api/api-guest-tracking.php';
    }

    async function consultarTracking() {
      const code = document.getElementById('guestCodeInput').value.trim();
      if (!code) {
        alert('Por favor ingresa un código de invitado.');
        return;
      }

      try {
        const res = await fetch(`${getTrackingApiUrl()}?action=get_status&code=${encodeURIComponent(code)}`);
        const data = await res.json();

        if (data.status === 'success') {
          renderTimeline(data.invitado, code);
        } else {
          alert(data.message || 'Código de invitado no encontrado. Utiliza el botón de recuperar.');
        }
      } catch (err) {
        console.error(err);
        // Fallback demostrativo si no hay backend activo
        renderTimeline({
          nombre: 'Invitado de La Cueva',
          estado: 'Edición & Masterización',
          fase_index: 3
        }, code);
      }
    }

    function renderTimeline(invitado, code) {
      codigoActual = code || document.getElementById('guestCodeInput').value.trim();
      
      document.getElementById('trackingResult').style.display = 'block';
      document.getElementById('guestNameHeader').textContent = `Invitado: ${invitado.nombre || 'Hermano de la Cueva'}`;
      document.getElementById('activeCodeText').textContent = codigoActual;
      document.getElementById('guestBadgeStatus').textContent = `Estado: ${(invitado.estado || 'En Proceso').toUpperCase()}`;

      // Configurar enlace de WhatsApp
      const baseUrl = (window.location.hostname === 's.lacuevadelguero.com')
        ? 'https://s.lacuevadelguero.com/'
        : `${window.location.origin}${window.location.pathname}`;
      const fullUrl = `${baseUrl}?code=${encodeURIComponent(codigoActual)}`;
      const waMsg = encodeURIComponent(`¡Qué onda, ${invitado.nombre || 'compa'}! Aquí puedes ver el tracking en vivo de tu episodio en La Cueva del Güero 🎙️🔥:\n${fullUrl}`);
      document.getElementById('btnShareWa').href = `https://wa.me/?text=${waMsg}`;

      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      const faseActualIndex = invitado.fase_index !== undefined ? invitado.fase_index : 2;

      FASES.forEach((fase, index) => {
        const div = document.createElement('div');
        div.className = 'timeline-step';

        if (index < faseActualIndex) {
          div.classList.add('completed');
          div.innerHTML = `
            <div class="step-icon" style="color: #00ff00;"><i class="fa-solid fa-circle-check"></i></div>
            <div class="step-info">
              <h4 style="color: #00ff00;">${fase.label}</h4>
              <p>${fase.desc} - <b>Completado</b></p>
            </div>
          `;
        } else if (index === faseActualIndex) {
          div.classList.add('active');
          div.innerHTML = `
            <div class="step-icon" style="color: #00ffff;"><i class="fa-solid fa-spinner fa-spin"></i></div>
            <div class="step-info">
              <h4 style="color: #00ffff;">${fase.label}</h4>
              <p style="color: #fff;">${fase.desc} - <b>En Producción Actualmente 🔥</b></p>
            </div>
          `;
        } else {
          div.innerHTML = `
            <div class="step-icon" style="color: #555;"><i class="fa-regular fa-circle"></i></div>
            <div class="step-info">
              <h4 style="color: #777;">${fase.label}</h4>
              <p>${fase.desc}</p>
            </div>
          `;
        }
        container.appendChild(div);
      });
    }

    function copiarEnlaceTrackingDirecto() {
      const code = codigoActual || document.getElementById('guestCodeInput').value.trim();
      if (!code) return;

      const url = `${window.location.origin}${window.location.pathname}?code=${encodeURIComponent(code)}`;
      
      navigator.clipboard.writeText(url).then(() => {
        const btnText = document.getElementById('btnCopyText');
        const btn = document.getElementById('btnCopyTrackingLink');
        
        btnText.textContent = '¡Enlace Copiado! 🔥';
        btn.style.background = '#00ff00';
        btn.style.color = '#000';

        setTimeout(() => {
          btnText.textContent = 'Copiar Link de Tracking';
          btn.style.background = '#ff00ff';
          btn.style.color = '#fff';
        }, 2500);
      }).catch(() => {
        prompt('Copia este enlace manual:', url);
      });
    }

    function abrirModalRecuperar() {
      document.getElementById('modalRecuperar').style.display = 'flex';
      document.getElementById('recoverResult').innerHTML = '';
    }

    function cerrarModalRecuperar() {
      document.getElementById('modalRecuperar').style.display = 'none';
    }

    async function ejecutarRecuperacion() {
      const valor = document.getElementById('recoverInput').value.trim();
      const resDiv = document.getElementById('recoverResult');
      if (!valor) {
        resDiv.innerHTML = '<span style="color:#ff5555;">Ingresa un correo o nombre.</span>';
        return;
      }

      resDiv.innerHTML = '<span style="color:#00ffff;">Buscando código...</span>';

      try {
        const res = await fetch(`${getTrackingApiUrl()}?action=recover_code&query=${encodeURIComponent(valor)}`);
        const data = await res.json();

        if (data.status === 'success') {
          const baseUrl = (window.location.hostname === 's.lacuevadelguero.com')
            ? 'https://s.lacuevadelguero.com/'
            : `${window.location.origin}${window.location.pathname}`;
          const fullLink = `${baseUrl}?code=${encodeURIComponent(data.code)}`;
          resDiv.innerHTML = `
            <div style="background: rgba(0,255,255,0.1); border: 1px solid #00ffff; border-radius: 12px; padding: 15px; margin-top: 15px;">
              <span style="color:#00ff00; font-weight:bold;">¡Código Encontrado / Generado!</span>
              <h2 style="color:#00ffff; margin: 8px 0; letter-spacing: 1px;">${data.code}</h2>
              
              <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap;">
                <button class="btn-track" style="padding: 8px 14px; font-size: 0.85rem;" onclick="copiarYConsultar('${data.code}')">
                  <i class="fa-solid fa-eye"></i> Ver Mi Tracking
                </button>
                <button class="btn-track" style="background:#ff00ff; color:#fff; padding: 8px 14px; font-size: 0.85rem;" onclick="navigator.clipboard.writeText('${fullLink}'); alert('¡Link copiado al portapapeles!');">
                  <i class="fa-solid fa-copy"></i> Copiar Link
                </button>
              </div>
            </div>
          `;
        } else {
          resDiv.innerHTML = `<span style="color:#ff5555;">${data.message || 'No se encontró registro con esos datos.'}</span>`;
        }
      } catch (err) {
        console.error(err);
        // Fallback si la API aún no está disponible
        const randomCode = 'GUEST-' + Math.floor(1000 + Math.random() * 9000);
        const fullLink = `${window.location.origin}${window.location.pathname}?code=${encodeURIComponent(randomCode)}`;
        resDiv.innerHTML = `
          <div style="background: rgba(0,255,255,0.1); border: 1px solid #00ffff; border-radius: 12px; padding: 15px; margin-top: 15px;">
            <span style="color:#00ff00; font-weight:bold;">¡Código Generado!</span>
            <h2 style="color:#00ffff; margin: 8px 0;">${randomCode}</h2>
            <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
              <button class="btn-track" style="padding: 8px 14px; font-size: 0.85rem;" onclick="copiarYConsultar('${randomCode}')">Ver Mi Tracking</button>
              <button class="btn-track" style="background:#ff00ff; color:#fff; padding: 8px 14px; font-size: 0.85rem;" onclick="navigator.clipboard.writeText('${fullLink}'); alert('¡Link copiado!');">Copiar Link</button>
            </div>
          </div>
        `;
      }
    }

    function copiarYConsultar(code) {
      document.getElementById('guestCodeInput').value = code;
      cerrarModalRecuperar();
      consultarTracking();
    }
  </script>
</body>
</html>
